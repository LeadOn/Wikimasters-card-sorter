<!doctype html>
<!-- Gabarit des vignettes promotionnelles du Chrome Web Store (rendu par une capture d'écran, page servie
     depuis la racine du dépôt pour trouver les polices) : promo.html?large → 1400 × 560, sinon 440 × 280.
     Même charte que l'extension : graphite, texte « os », le vert anis seulement sur l'onglet de la marque. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "WMT Sans"; src: url("../node_modules/@fontsource-variable/ibm-plex-sans/files/ibm-plex-sans-latin-wght-normal.woff2") format("woff2"); font-weight: 100 700; }
  @font-face { font-family: "WMT Mono"; src: url("../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2") format("woff2"); font-weight: 500; }
  @font-face { font-family: "WMT Mono"; src: url("../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-600-normal.woff2") format("woff2"); font-weight: 600; }
  :root { --r-L: #ffe144; --r-UR: #fa9931; --r-SR: #ed6fa3; --r-R: #c6a7f2; --r-PC: #b1cff2; --r-C: #b8f2d5; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "WMT Sans", ui-sans-serif, system-ui, sans-serif; background: #121211; -webkit-font-smoothing: antialiased; }
  .tile { position: relative; overflow: hidden; color: #eeece5; display: flex; align-items: center; background: #121211; }
  /* Filets d'une fiche de classement, très discrets */
  .tile::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(to bottom, transparent 0 27px, rgba(238, 236, 229, 0.035) 27px 28px); }
  .small { width: 440px; height: 280px; padding: 34px; gap: 26px; }
  .large { width: 1400px; height: 560px; padding: 72px; gap: 64px; }
  .mark { position: relative; flex: none; }
  .small .mark { width: 96px; height: 96px; }
  .large .mark { width: 168px; height: 168px; }
  .text { position: relative; display: flex; flex-direction: column; }
  h1 { font-weight: 600; letter-spacing: -0.03em; line-height: 1.02; }
  .small h1 { font-size: 34px; }
  .large h1 { font-size: 72px; }
  p { color: #a29f95; font-weight: 500; }
  .small p { font-size: 15px; margin-top: 10px; }
  .large p { font-size: 28px; margin-top: 18px; }
  .rarities { display: flex; gap: 5px; }
  .small .rarities { margin-top: 16px; }
  .large .rarities { margin-top: 28px; gap: 8px; }
  .rarities span { display: inline-grid; place-items: center; min-width: 26px; height: 20px; padding: 0 5px; border-radius: 3px; font: 600 11px/1 "WMT Mono", monospace; color: #121211; }
  .large .rarities span { min-width: 46px; height: 32px; font-size: 17px; border-radius: 5px; }
  .note { color: #807d74; font: 500 11px "WMT Mono", monospace; letter-spacing: 0.02em; }
  .small .note { margin-top: 14px; }
  .large .note { margin-top: 24px; font-size: 17px; }
  .shot { position: relative; margin-left: auto; width: 620px; border-radius: 12px; border: 1px solid #3a3a35; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5); }
  .small .shot { display: none; }
</style>
</head>
<body>
<div class="tile small" id="tile">
  <!-- Marque : extension/src/shared/brand.mjs (MARK) -->
  <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="14" y="6.5" width="5.5" height="5" rx="1" fill="#c5ef55"/><rect x="5" y="3" width="11" height="18" rx="1.5" fill="#eeece5"/></svg>
  <div class="text">
    <h1>WikiMasters<br>Toolbox</h1>
    <p>Tri, prix, échanges et paquets</p>
    <div class="rarities"><span style="background:var(--r-L)">L</span><span style="background:var(--r-UR)">UR</span><span style="background:var(--r-SR)">SR</span><span style="background:var(--r-R)">R</span><span style="background:var(--r-PC)">PC</span><span style="background:var(--r-C)">C</span></div>
    <span class="note">extension non officielle</span>
  </div>
  <img class="shot" src="images/capture-1.png" alt="">
</div>
<script>
  if (location.search.includes("large")) document.getElementById("tile").className = "tile large";
</script>
</body>
</html>
