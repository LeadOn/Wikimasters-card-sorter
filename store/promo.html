<head>
<meta charset="utf-8">
<style>
  :root { --r-L: #ffe144; --r-UR: #fa9931; --r-SR: #ed6fa3; --r-R: #c6a7f2; --r-PC: #b1cff2; --r-C: #b8f2d5; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #0d0e14; }
  .tile { position: relative; overflow: hidden; color: #fff; display: flex; align-items: center; background: radial-gradient(120% 140% at 0% 0%, #4f46e5 0%, #312e81 45%, #1e1b4b 100%); }
  .tile::after { content: ""; position: absolute; inset: auto -20% -60% 40%; height: 120%; background: radial-gradient(closest-side, rgba(147, 51, 234, 0.55), transparent); }
  .small { width: 440px; height: 280px; padding: 30px; gap: 22px; }
  .large { width: 1400px; height: 560px; padding: 70px; gap: 60px; }
  .icon { flex: none; filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.45)); position: relative; z-index: 1; }
  .small .icon { width: 112px; height: 112px; margin: -8px; }
  .large .icon { width: 190px; height: 190px; margin: -12px; }
  .text { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 10px; }
  h1 { font-weight: 800; letter-spacing: -0.02em; line-height: 1.05; }
  .small h1 { font-size: 30px; }
  .large h1 { font-size: 64px; }
  p { color: #c7d2fe; font-weight: 600; }
  .small p { font-size: 15px; }
  .large p { font-size: 28px; }
  .rarities { display: flex; gap: 6px; margin-top: 4px; }
  .rarities span { display: inline-grid; place-items: center; min-width: 26px; height: 20px; padding: 0 6px; border-radius: 6px; font-size: 11px; font-weight: 800; color: #0d1117; }
  .large .rarities span { min-width: 44px; height: 32px; font-size: 17px; border-radius: 9px; }
  .note { color: #a5b4fc; font-weight: 500; opacity: 0.85; }
  .small .note { font-size: 11px; }
  .large .note { font-size: 18px; }
  .shot { position: relative; z-index: 1; margin-left: auto; width: 620px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.14); box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5); }
  .small .shot { display: none; }
</style>
